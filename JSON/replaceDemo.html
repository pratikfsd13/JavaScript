<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="container">
        <p id="para">This is My First JS DOM Project</p>
        <button onclick="swap2()">Click me to Swap</button>
    </div>
    <script>
        //old approach
        function swap() {
            const container = document.getElementById('container');
            const newPara = document.createElement('p');
            newPara.textContent = 'New JS Project';
            const oldPara = document.getElementById('para');
            container.replaceChild(newPara, oldPara);
        }
        // new approach
        function swap2() {
            const newPara = document.createElement('p');
            newPara.textContent = 'New TATA Project';
            const oldPara = document.getElementById('para');
            oldPara.replaceWith(newPara);
        }
   
    </script>
</body>
</html>
