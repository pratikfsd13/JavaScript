<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="container">
       <p id="para"> Welcome User </p>
        <button onclick="swap()">Upgrade Me</button>
    </div>
    <script>
        function swap() {
            const container = document.getElementById('container');
            const newPara = document.createElement('p');
            newPara.textContent = 'Premium User Activated';
            const oldPara = document.getElementById('para');
            container.replaceChild(newPara, oldPara);
        }
    </script>
</body>
</html>
