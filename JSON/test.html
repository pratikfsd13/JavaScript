<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Box</title>
    <style>
        #box {
            background-color: red;
            width: 200px;   
            height: 200px;
            /* Optional: Add a transition for a smooth color change */
            transition: background-color 0.3s ease;
        }
        
        /* This automatically applies when the mouse is over the element */
        #box:hover {
            background-color: green;
        }
    </style>
</head>
<body>
    <div id="box"></div>
</body>
</html>
